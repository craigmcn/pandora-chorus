name: Deploy background audio spike

on:
  push:
    branches: [spike/background-audio]
    paths: [spikes/background-audio/**, .github/workflows/spike-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp version
        run: |
          build="${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s/^const BUILD = \"dev\";/const BUILD = \"$build\";/" spikes/background-audio/app.js
          grep -q "^const BUILD = \"$build\";" spikes/background-audio/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: spikes/background-audio
      - id: deployment
        uses: actions/deploy-pages@v4
