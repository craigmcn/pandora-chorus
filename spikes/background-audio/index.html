<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Background Audio Spike</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Audio Spike" />
    <meta name="theme-color" content="#6a1b9a" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Background audio spike</h1>
      <p id="version" class="muted"></p>
      <p id="env" class="muted"></p>

      <section aria-labelledby="settings-h">
        <h2 id="settings-h">Settings</h2>
        <fieldset>
          <legend>Strategy</legend>
          <label><input type="radio" name="strategy" value="single" /> One audio element, swap <code>src</code></label>
          <label><input type="radio" name="strategy" value="dual" /> Two audio elements, alternate</label>
        </fieldset>
        <fieldset>
          <legend>Source</legend>
          <label><input type="radio" name="source" value="network" /> Network (bypasses cache)</label>
          <label><input type="radio" name="source" value="sw" /> Service worker cache (range requests)</label>
          <label><input type="radio" name="source" value="blob" /> Blob URLs from cache</label>
        </fieldset>
        <fieldset>
          <legend>Options</legend>
          <label>Speed
            <select id="speed">
              <option value="1">1×</option>
              <option value="0.75">0.75×</option>
            </select>
          </label>
          <label><input type="checkbox" id="mediaSession" /> Media Session (lock-screen controls)</label>
          <label><input type="checkbox" id="audioSession" /> <code>navigator.audioSession.type = "playback"</code></label>
          <label><input type="checkbox" id="repeatOne" /> Repeat one song</label>
        </fieldset>
        <p>
          <button type="button" id="download">Download for offline</button>
          <span id="cacheStatus" class="muted"></span>
        </p>
      </section>

      <section aria-labelledby="player-h">
        <h2 id="player-h">Player</h2>
        <p id="nowPlaying" aria-live="polite">Stopped</p>
        <p class="controls">
          <button type="button" id="prev" aria-label="Previous song">⏮</button>
          <button type="button" id="playPause">Play</button>
          <button type="button" id="next" aria-label="Next song">⏭</button>
        </p>
      </section>

      <section aria-labelledby="results-h">
        <h2 id="results-h">Results</h2>
        <p id="summary"></p>
        <p>
          <button type="button" id="copy">Copy report</button>
          <button type="button" id="clear">Clear log</button>
        </p>
        <ol id="log" class="log"></ol>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
